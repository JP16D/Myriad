name: Release Mod

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Acari Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/35.0.0" >> $GITHUB_PATH
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build mod jar
      run: |
        chmod +x ./gradlew
        ./gradlew :acari:dex
    - name: Upload release artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release upload "${{ github.event.release.tag_name }}" \
          "modules/acari/build/libs/${{ github.event.repository.name }}.jar" \
          --clobber

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    - name: Publish to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        chmod +x ./gradlew
        ./gradlew publishAll
