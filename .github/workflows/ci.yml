name: Build Mod

on: [push, pull_request]

jobs:
  buildJar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up PATH
      run: |
        echo "${ANDROID_HOME}/build-tools/35.0.0" >> $GITHUB_PATH
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build mod jar
      run: |
        chmod +x ./gradlew
        ./gradlew :myriad-acari:dex
    - name: Upload built jar file
      uses: actions/upload-artifact@v7
      with:
        archive: false
        name: ${{ github.event.repository.name }}:Acari
        path: myriad-acari/build/libs/MyriadAcari.jar